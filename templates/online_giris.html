<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Sınav Giriş Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans flex flex-col justify-between p-4">
    <header class="w-full max-w-md mx-auto pt-8 text-center">
        <a href="/" class="text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-xl shadow-sm inline-block">⬅️ Ana Sayfaya Dön</a>
        <h1 class="text-2xl font-black text-slate-900 mt-4">Online Sınav Giriş</h1>
        <p class="text-xs text-slate-500 mt-1">Sınava katılmak için numaranızı girin ve test seçin.</p>
    </header>

    <main class="w-full max-w-md mx-auto my-auto space-y-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}{% for cat, msg in messages %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs font-bold text-center">{{ msg }}</div>
          {% endfor %}{% endif %}
        {% endwith %}

        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Okul Numarası</label>
                    <input type="text" name="ogrenci_no" required placeholder="Numaranız" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-300 font-bold text-slate-900 text-sm outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Aktif Sınav / Test</label>
                    <select name="test_adi" required class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-300 font-bold text-slate-900 text-sm outline-none focus:ring-2 focus:ring-indigo-600">
                        <option value="">-- Sınav Seçiniz --</option>
                        {% for t in aktif_testler %}
                        <option value="{{ t.test_adi }}">{{ t.test_adi }} (Süre: {{ t.sure_dakika }} dk)</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition text-sm">
                    Sınavı Başlat 🚀
                </button>
            </form>
        </div>
    </main>
    <footer class="text-center py-6 text-xs text-slate-400">© 2026 Büşra Güngör</footer>
</body>
</html>
